syntax = "proto3";

package blockio;

option go_package = "./blockio";

message CreateReq {
    string path = 1;
    uint32 mode = 2;
    uint64 size = 3;
}
message CreateRes {
    bool success = 1;
}
message WriteReq {
    string path = 1;
    int64 offset = 2;
    bytes data = 3;
}
message WriteRes {
    bool success = 1;
    int32 n = 2;
}
service Copier {
    rpc Create(CreateReq) returns (CreateRes);
    rpc Write(WriteReq) returns (WriteRes);
}